<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>千寻 · Three.js 角色模型</title>
  <style>
    :root { color-scheme: dark; --ink:#ece4d2; --muted:#93a299; --line:rgba(191,168,113,.25); --accent:#b9d48d; }
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; }
    body {
      color: var(--ink);
      font-family: "Noto Sans SC", "Hiragino Sans", system-ui, sans-serif;
      background:
        radial-gradient(circle at 52% 28%, rgba(51,94,72,.52), transparent 34%),
        radial-gradient(circle at 80% 78%, rgba(119,76,40,.18), transparent 38%),
        linear-gradient(160deg, #10231d 0%, #07100e 58%, #050a09 100%);
    }
    #app { position: fixed; inset: 0; }
    canvas { display:block; width:100%; height:100%; }
    .hud { position: fixed; inset: 0; pointer-events: none; }
    .brand { position:absolute; left:clamp(20px,4vw,58px); top:clamp(20px,4vw,46px); max-width: 360px; }
    .eyebrow { color:#c2ad76; font-size:10px; letter-spacing:.32em; text-transform:uppercase; }
    h1 { margin:12px 0 4px; font-family:"Yu Mincho","Hiragino Mincho ProN",serif; font-size:clamp(28px,4vw,46px); font-weight:400; letter-spacing:.14em; }
    .sub { color:#c7d0c6; font-size:12px; letter-spacing:.18em; }
    .note { color:var(--muted); font-size:11px; line-height:1.8; margin-top:16px; max-width:310px; }
    .controls { position:absolute; left:clamp(16px,3vw,42px); bottom:clamp(16px,3vw,36px); width:min(620px, calc(100vw - 32px)); pointer-events:auto; }
    .bar { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:12px; }
    button { appearance:none; border:1px solid var(--line); background:rgba(9,20,17,.78); color:#e6dfce; padding:10px 15px; font:inherit; font-size:12px; letter-spacing:.1em; cursor:pointer; transition:.2s border-color,.2s background,.2s transform; }
    button:hover { border-color:rgba(212,184,113,.6); background:rgba(25,43,34,.9); transform:translateY(-1px); }
    button.active { border-color:rgba(185,212,141,.65); color:#dcebc6; background:rgba(34,57,44,.88); }
    button.jump { border-color:rgba(206,155,88,.55); color:#f0d4a3; }
    .sliders { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px 18px; padding:14px 16px; border:1px solid rgba(192,176,132,.18); background:rgba(6,14,12,.72); backdrop-filter:blur(8px); }
    .slider { display:grid; grid-template-columns: 72px 1fr 42px; gap:8px; align-items:center; font-size:10px; color:#aebbb2; letter-spacing:.06em; }
    input[type=range] { width:100%; accent-color:#a8c87a; }
    output { font-variant-numeric: tabular-nums; color:#d9cfae; text-align:right; }
    .status { margin-top:9px; color:#7f9086; font-size:10px; letter-spacing:.12em; }
    .status b { color:#ced9c5; font-weight:500; }
    .hint { position:absolute; right:clamp(18px,3vw,38px); bottom:clamp(20px,3vw,38px); color:#718078; font-size:10px; text-align:right; line-height:1.8; letter-spacing:.08em; }
    @media (max-width:700px) {
      .brand { max-width:260px; }
      .note { display:none; }
      .sliders { grid-template-columns:1fr; }
      .hint { display:none; }
    }
  </style>
  <script type="module" crossorigin src="./assets/chihiroModel-vN_lQBbp.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/three.module-Dp9HODBv.js">
</head>
<body>
  <div id="app"></div>
  <div class="hud">
    <header class="brand">
      <div class="eyebrow">THREE.JS CHARACTER STUDY</div>
      <h1>千尋</h1>
      <div class="sub">千与千寻 · 可动角色模型</div>
      <p class="note">棕色侧马尾、绿白条纹短袖、橙色短裤、白袜与黄褐色鞋。模型使用可摆动的关节层级，行走、奔跑和跳跃参数都可以实时调整。</p>
    </header>

    <div class="controls">
      <div class="bar">
        <button data-action="idle" class="active">待机</button>
        <button data-action="walk">行走</button>
        <button data-action="run">奔跑</button>
        <button id="jump" class="jump">跳跃</button>
      </div>
      <div class="sliders">
        <label class="slider">步频 <input id="speed" type="range" min="0.6" max="3.8" step="0.1" value="2.2"><output id="speed-v">2.2</output></label>
        <label class="slider">步幅 <input id="stride" type="range" min="0.15" max="0.9" step="0.01" value="0.52"><output id="stride-v">0.52</output></label>
        <label class="slider">摆臂 <input id="swing" type="range" min="0" max="0.9" step="0.01" value="0.42"><output id="swing-v">0.42</output></label>
        <label class="slider">跳跃高度 <input id="jump-h" type="range" min="0.12" max="0.9" step="0.01" value="0.46"><output id="jump-h-v">0.46</output></label>
        <label class="slider">跳跃时长 <input id="jump-d" type="range" min="0.35" max="1.4" step="0.01" value="0.72"><output id="jump-d-v">0.72</output></label>
        <label class="slider">身高 <input id="height" type="range" min="1.15" max="1.75" step="0.01" value="1.42"><output id="height-v">1.42</output></label>
      </div>
      <div class="status">动作状态：<b id="state">idle</b> · 拖动鼠标旋转视角 · 空格跳跃</div>
    </div>
    <div class="hint">鼠标左键旋转 / 滚轮缩放<br>拖拽查看头发与服装细节</div>
  </div>
</body>
</html>
